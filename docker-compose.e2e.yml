name: new_library_e2e

services:
  e2e-db:
    image: postgres:16-alpine
    container_name: new_library_e2e_db
    environment:
      POSTGRES_DB: ${E2E_POSTGRES_DB:?Set E2E_POSTGRES_DB in .env.e2e}
      POSTGRES_USER: ${E2E_POSTGRES_USER:?Set E2E_POSTGRES_USER in .env.e2e}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?Set E2E_POSTGRES_PASSWORD in .env.e2e}
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [e2e]

  e2e-redis:
    image: redis:7-alpine
    container_name: new_library_e2e_redis
    command: redis-server --appendonly yes
    volumes:
      - e2e_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [e2e]

  e2e-minio:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile
    container_name: new_library_e2e_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_ROOT_USER:?Set E2E_MINIO_ROOT_USER in .env.e2e}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_ROOT_PASSWORD:?Set E2E_MINIO_ROOT_PASSWORD in .env.e2e}
    volumes:
      - e2e_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [e2e]

  e2e-minio-init:
    build: ./backend
    container_name: new_library_e2e_minio_init
    command: python manage.py ensure_storage_bucket
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_ROOT_USER:?Set E2E_MINIO_ROOT_USER in .env.e2e}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_ROOT_PASSWORD:?Set E2E_MINIO_ROOT_PASSWORD in .env.e2e}
      MINIO_ENDPOINT: e2e-minio:9000
      MINIO_BUCKET: e2e-library-media
      MINIO_USE_SSL: "False"
    depends_on:
      e2e-minio:
        condition: service_healthy
    networks: [e2e]

  e2e-backend:
    build: ./backend
    container_name: new_library_e2e_backend
    env_file: .env.e2e
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120"
    volumes:
      - e2e_static_data:/app/staticfiles
    depends_on:
      e2e-db:
        condition: service_healthy
      e2e-redis:
        condition: service_healthy
      e2e-minio:
        condition: service_healthy
      e2e-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [e2e]

  e2e-frontend:
    build: ./frontend
    container_name: new_library_e2e_frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      e2e-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [e2e]

  e2e-proxy:
    image: nginx:1.27-alpine
    container_name: new_library_e2e_proxy
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./infrastructure/nginx/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
      - e2e_static_data:/srv/static:ro
    depends_on:
      e2e-backend:
        condition: service_healthy
      e2e-frontend:
        condition: service_healthy
    networks: [e2e, e2e_proxy]

volumes:
  e2e_postgres_data:
    name: new_library_e2e_postgres_data
  e2e_redis_data:
    name: new_library_e2e_redis_data
  e2e_minio_data:
    name: new_library_e2e_minio_data
  e2e_static_data:
    name: new_library_e2e_static_data

networks:
  e2e:
    name: new_library_e2e_network
    driver: bridge
    internal: true
  e2e_proxy:
    name: new_library_e2e_proxy_network
    driver: bridge
