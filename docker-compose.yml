services:
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [library]

  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [library]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitallibrary}
      POSTGRES_USER: ${POSTGRES_USER:-digitallibrary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitallibrary} -d ${POSTGRES_DB:-digitallibrary}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [library]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [library]

  celery:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [library]

  celery-beat:
    build: ./backend
    env_file: .env
    command: celery -A config beat -l info
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [library]

  minio:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [library]

  minio-init:
    build: ./backend
    command: python manage.py ensure_storage_bucket
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-library-media}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [library]

  nginx:
    image: nginx:1.27-alpine
    
    ports:
    - "${HTTP_PORT:-8081}:80"


    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [library]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_data:

networks:
  library:
    driver: bridge
